name: sunnyrides_desktop
description: Desktop aplikacija SunnyRides za administratore i uposlenike agencije.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  printing: ^5.15.0
  file_selector: ^1.1.0

  # Zajednicki sloj: API klijent, modeli, tokeni, SignalR veza i dizajn. Lokalni
  # paket u istom repozitoriju, pa se vuce po putanji umjesto sa pub.dev-a.
  sunnyrides_core:
    path: ../sunnyrides_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
